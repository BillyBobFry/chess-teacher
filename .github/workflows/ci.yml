name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/llm-chess-teaching-concept-6v3bn7

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same major version as the Vercel function runtime (nodejs22.x in scripts/build-vercel.mjs).
  NODE_VERSION: 22

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Stockfish (for the engine integration test)
        run: sudo apt-get update -q && sudo apt-get install -y -q stockfish
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Migrations match the schema
        run: pnpm --filter @chess-teacher/api db:check
      - name: Production build
        run: pnpm build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @chess-teacher/web exec playwright install --with-deps chromium
      - name: Build and run the smoke test
        run: pnpm smoke smoke-screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: apps/web/smoke-screenshots
          if-no-files-found: ignore
          retention-days: 7
